    <style>
        :root {
            --primary-color: #4db6ac; /* 優しいターコイズブルー（ミント系） */
            --primary-light: #e0f2f1; /* 背景やアクセント用の薄い水色ミント */
            --primary-dark: #00897b;  /* 引き締め用の深い緑系ターコイズ */

        * {

            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.7;
        }

        /* ヘッダー */
        header {
            background: linear-gradient(135deg, var(--primary-light), #ffffff);
            padding: 40px 20px;
            text-align: center;
            border-bottom: 4px solid var(--primary-color);
        }

        .logo-area img {

            height: 80px;
            border-radius: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            object-fit: contain;
            background: #fff;
        }

        header h1 {
            font-size: 1.8rem;
            color: var(--primary-dark);
            margin-bottom: 10px;
        }

        header p {
            font-size: 1rem;
            color: #607d8b;
        }

        /* メインコンテナ */
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* カード共通 */
        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 8px 24px rgba(77, 182, 172, 0.12);
            margin-bottom: 30px;
            text-align: center;
        }

        .card h2 {
            font-size: 1.4rem;
            color: var(--primary-dark);
            margin-bottom: 20px;
        }

        .card p {
            margin-bottom: 25px;
            color: #546e7a;
        }

        /* ダウンロード注意書きのスタイル */
        .download-notice {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px dashed #b2ebf2;
            font-size: 0.85rem;
            color: #546e7a;
            text-align: center;
            line-height: 1.6;
        }

        .notice-main {
            margin-bottom: 6px;
            color: var(--primary-dark);
        }

        .notice-sub {
            font-size: 0.8rem;
            color: #78909c;
        }

            font-weight: bold;
            text-decoration: underline;
            transition: color 0.2s;
        }

        .notice-sub a:hover {
            color: var(--primary-dark);
